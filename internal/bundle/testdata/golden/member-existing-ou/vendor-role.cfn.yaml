AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  The automat vendor role. Creates one IAM role in the organization's management
  account that account 222222222222 may assume to create and place member accounts inside
  organizational unit ou-exam-research1, and nothing else. Deploy in the management account.

# Generated by automat v0.1.0-test at 2026-08-05T14:00:00Z. Review before deploying: this file is the
# entire grant being requested, and it is meant to be read in full.

Resources:
  AutomatVendorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: 'automat-vendor'
      Description: >-
        Lets account 222222222222 vend member accounts into OU ou-exam-research1. Managed by automat.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AutomatMemberAccountMayAssumeWithExternalId
            Effect: Allow
            Principal:
              AWS: 'arn:aws:iam::222222222222:role/automat-runner'
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: 'EXAMPLE-NOT-A-REAL-EXTERNAL-ID'
      Policies:
        - PolicyName: automat-vend
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Account creation. The tag condition means every account this role
              # creates is attributable: an untagged account cannot be created at all.
              - Sid: CreateTaggedAccounts
                Effect: Allow
                Action:
                  - organizations:CreateAccount
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestTag/automat:vended-by: '222222222222'
                    aws:RequestTag/automat:ou: 'ou-exam-research1'

              # Placement. This is the statement that bounds the blast radius, and it
              # is bounded at both ends because MoveAccount authorizes against the
              # destination parent AND the account being moved.
              #
              # Destination: this OU or one below it, by resource. Account: only one
              # this role vended, by condition. The account resource pattern cannot
              # express the second -- an Organizations account ARN encodes the
              # organization, not the account's OU, so account/<org>/* is every
              # account here. Without the condition this statement would read "move
              # ANY account in the organization into this OU", and since an account
              # has exactly one parent, moving one IN moves it OUT from under
              # whatever service control policies bound it before.
              - Sid: MoveAccountsIntoTheDelegatedSubtreeOnly
                Effect: Allow
                Action:
                  - organizations:MoveAccount
                Resource:
                  - !Sub 'arn:${AWS::Partition}:organizations::${AWS::AccountId}:account/o-exampleorgid/*'
                  - !Sub 'arn:${AWS::Partition}:organizations::${AWS::AccountId}:ou/o-exampleorgid/ou-exam-research1'
                  - !Sub 'arn:${AWS::Partition}:organizations::${AWS::AccountId}:ou/o-exampleorgid/ou-exam-research1/*'
                Condition:
                  StringEquals:
                    aws:ResourceTag/automat:vended-by: '222222222222'

              # Sub-OUs, restricted to the delegated subtree as the parent.
              - Sid: CreateOrganizationalUnitsInsideTheSubtreeOnly
                Effect: Allow
                Action:
                  - organizations:CreateOrganizationalUnit
                Resource:
                  - !Sub 'arn:${AWS::Partition}:organizations::${AWS::AccountId}:ou/o-exampleorgid/ou-exam-research1'
                  - !Sub 'arn:${AWS::Partition}:organizations::${AWS::AccountId}:ou/o-exampleorgid/ou-exam-research1/*'

              # Tagging. Two bounds, and both are load-bearing.
              #
              # The RESOURCE bound excludes policies. On '*' this statement would
              # reach every service control policy ARN in the organization, and
              # tagging one of yours with automat:managed-by=automat would hand the
              # delegation policy in delegation-policy.json permission to rewrite
              # it -- that document gates update, delete, and detach on exactly
              # that tag. The role would never touch policy CONTENT; it would just
              # forge the label that decides who may.
              #
              # The KEY bound is an explicit list, not automat:*. The keys omitted
              # from it are omitted on purpose: automat:vended-by and automat:ou
              # are read by conditions elsewhere in this bundle, so a principal
              # that could write them would not be constrained by those conditions.
              # Both are applied once, at CreateAccount, through aws:RequestTag
              # above -- so nothing legitimate needs to set them again, and this
              # statement cannot. The three keys below are cost-allocation and
              # inventory labels that no condition anywhere reads, which is what
              # makes them safe to leave mutable.
              # Accounts and OUs are separate statements because only one of them
              # can be confined by a tag. account/<org>/* is every account in the
              # organization -- an Organizations account ARN encodes the org, not
              # the OU -- so the account statement carries a condition instead: the
              # account must already be one this role vended. A fresh OU has no
              # tags at all, so the same condition there would make tagging a
              # newly created OU impossible; its ARN does encode the subtree, so
              # the resource bound is a real one.
              - Sid: TagAccountsThisRoleVended
                Effect: Allow
                Action:
                  - organizations:TagResource
                Resource:
                  - !Sub 'arn:${AWS::Partition}:organizations::${AWS::AccountId}:account/o-exampleorgid/*'
                Condition:
                  StringEquals:
                    aws:ResourceTag/automat:vended-by: '222222222222'
                  ForAllValues:StringEquals:
                    aws:TagKeys:
                      - 'automat:artifact-id'
                      - 'automat:artifact-sha256'
                      - 'automat:version'

              - Sid: TagOrganizationalUnitsInTheSubtree
                Effect: Allow
                Action:
                  - organizations:TagResource
                Resource:
                  - !Sub 'arn:${AWS::Partition}:organizations::${AWS::AccountId}:ou/o-exampleorgid/ou-exam-research1'
                  - !Sub 'arn:${AWS::Partition}:organizations::${AWS::AccountId}:ou/o-exampleorgid/ou-exam-research1/*'
                Condition:
                  ForAllValues:StringEquals:
                    aws:TagKeys:
                      - 'automat:artifact-id'
                      - 'automat:artifact-sha256'
                      - 'automat:version'

              # The reads that make the above verifiable. No policy actions appear
              # anywhere in this role -- those flow through the delegation policy in
              # delegation-policy.json, which is separately scoped and separately
              # reviewable.
              - Sid: ReadTheOrganization
                Effect: Allow
                Action:
                  - organizations:DescribeCreateAccountStatus
                  - organizations:DescribeAccount
                  - organizations:DescribeOrganizationalUnit
                  - organizations:ListParents
                  - organizations:ListAccountsForParent
                  - organizations:ListOrganizationalUnitsForParent
                  - organizations:ListRoots
                Resource: '*'
      Tags:
        - Key: automat:managed-by
          Value: automat
        - Key: automat:vended-by
          Value: '222222222222'
        - Key: automat:ou
          Value: 'ou-exam-research1'

Outputs:
  VendorRoleArn:
    Description: Set this as vendor_role_arn in the requesting account's automat config.
    Value: !GetAtt AutomatVendorRole.Arn
